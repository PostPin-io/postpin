<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="application-name" content="PostPin" />
		<meta name="apple-mobile-web-app-title" content="PostPin" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d232a" />
		<script>
			// The theme picked in the account menu (#lib/theme.svelte.ts), set before the first
			// paint so a forced theme doesn't flash the system one
			try {
				var theme = localStorage.getItem("postpin-theme");
				if (theme === "light" || theme === "dark") {
					document.documentElement.dataset.theme = theme;
					var color = theme === "dark" ? "#1d232a" : "#ffffff";
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
						meta.content = color;
					});
				}
			} catch (e) {}
		</script>
		<meta property="og:site_name" content="PostPin" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-dvh">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>

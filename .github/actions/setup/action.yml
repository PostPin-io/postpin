name: Setup
description: Set up the environment for the workflow
inputs:
  ptsl-proto:
    description: Base64-encoded PTSL.proto. If set, the Pro Tools SDK is generated for desktop.
    required: false
    default: ""
outputs:
  ptsl-ready:
    description: "true if the Pro Tools SDK was generated"
    value: ${{ steps.ptsl.outputs.ready }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.16.1
    - uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: ptsl
      shell: bash
      env:
        PTSL_PROTO_B64: ${{ inputs.ptsl-proto }}
      run: |
        if [ -z "$PTSL_PROTO_B64" ]; then
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "$PTSL_PROTO_B64" | base64 -d | gunzip > packages/desktop/src/third-party/protools-sdk/PTSL.proto
        pnpm --filter @postpin-io/desktop run setup
        echo "ready=true" >> "$GITHUB_OUTPUT"

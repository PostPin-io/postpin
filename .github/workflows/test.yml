name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postpin
          POSTGRES_PASSWORD: postpin
          POSTGRES_DB: postpin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postpin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests migrate this database in their global setup
      TEST_DATABASE_URL: postgresql://postpin:postpin@localhost:5432/postpin_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

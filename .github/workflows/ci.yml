name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postpin
          POSTGRES_PASSWORD: postpin
          POSTGRES_DB: postpin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postpin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests migrate this database in their global setup
      TEST_DATABASE_URL: postgresql://postpin:postpin@localhost:5432/postpin_test?schema=public

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # renders the upload test fixtures (packages/postpin/tests/fixtures/generate-upload-fixtures.ts)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with:
          ptsl-proto: ${{ secrets.PTSL_PROTO_B64 }}
      - if: steps.setup.outputs.ptsl-ready == 'true'
        run: pnpm check
      - if: steps.setup.outputs.ptsl-ready != 'true'
        run: pnpm -r --filter '!@postpin-io/desktop' run check
  codegen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postpin
          POSTGRES_PASSWORD: postpin
          POSTGRES_DB: postpin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postpin"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postpin:postpin@localhost:5432/postpin_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @postpin-io/shared exec prisma migrate deploy --config prisma7.config.ts
      - run: pnpm --filter @postpin-io/postpin run generate:api
      - run: pnpm --filter @postpin-io/postpin run build:api-client
      - run: pnpm --filter @postpin-io/shared run db:generate
      - run: pnpm --filter @postpin-io/desktop run generate:ipc
      - run: pnpm --filter @postpin-io/plugin-electron run generate:ipc
      - run: git diff --exit-code
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status; git diff; exit 1
          fi
  # Premiere's native addon (Rust): the process tests on both platforms, lints on macOS
  addon:
    name: addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/plugin-premiere/native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/plugin-premiere/native
      - name: libclang for bindgen (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - run: cargo fmt --check
        if: runner.os == 'macOS'
      - run: cargo clippy --all-targets -- -D warnings
        if: runner.os == 'macOS'
      - run: cargo test
  docker:
    name: docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [postpin, worker]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postpin
          POSTGRES_PASSWORD: postpin
          POSTGRES_DB: postpin_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postpin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.image }}/Dockerfile
          build-args: POSTPIN_VERSION=ci-${{ github.sha }}
          tags: postpin-${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Image size
        run: docker image ls postpin-${{ matrix.image }}:ci --format '{{.Size}}'
      - name: Migrations apply from the image
        run: |
          docker run --rm --network host --entrypoint node \
            -e DATABASE_URL=postgresql://postpin:postpin@localhost:5432/postpin_smoke \
            postpin-${{ matrix.image }}:ci /app/migrate.mjs
      - name: Migrations are idempotent
        run: |
          out=$(docker run --rm --network host --entrypoint node \
            -e DATABASE_URL=postgresql://postpin:postpin@localhost:5432/postpin_smoke \
            postpin-${{ matrix.image }}:ci /app/migrate.mjs)
          echo "$out"
          grep -q "No pending migrations" <<< "$out"
      - name: ffmpeg is available
        if: matrix.image == 'worker'
        run: |
          docker run --rm --entrypoint ffmpeg postpin-worker:ci -version
          docker run --rm --entrypoint ffprobe postpin-worker:ci -version

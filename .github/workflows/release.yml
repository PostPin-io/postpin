name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/postpin-io

jobs:
  # Each image is built natively per architecture (QEMU emulation would take very long for the
  # worker) and pushed by digest only; the merge job tags them as one multi-arch image.
  build:
    name: build (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: postpin, package: postpin }
          - { name: worker, package: postpin-worker }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.image.name }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          build-args: POSTPIN_VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish (${{ matrix.image.name }})
    needs: [build, desktop-mac, desktop-win, resolve-mac, resolve-win, premiere]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: postpin, package: postpin, description: "PostPin web app and REST API" }
          - {
              name: worker,
              package: postpin-worker,
              description: "PostPin media worker (ffmpeg transcoding, thumbnails, probing)",
            }
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # 1.2.3 -> 1.2.3, 1.2, 1 and latest. Pre-releases only get their exact version: metadata-action
      # skips the major/minor patterns for them, and latest is enabled explicitly for stable tags only.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create multi-arch image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}
          DESCRIPTION: ${{ matrix.image.description }}
          VERSION: ${{ steps.meta.outputs.version }}
        # Index annotations: GHCR shows source and description of multi-arch images from these
        run: |
          mapfile -t tags < <(jq -r '.tags[] | ("-t", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            "${sources[@]}"

      - name: Inspect image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  # macOS: signed + notarized. Only this job gets the signing secrets (environment release, tags v*).
  desktop-mac:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          ptsl-proto: ${{ secrets.PTSL_PROTO_B64 }}
      - name: Set version from tag
        working-directory: packages/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build, sign and notarize
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # electron-builder wants the API key as a file path in APPLE_API_KEY
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          pnpm run dist -c.mac.notarize=true
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  # Windows: unsigned NSIS installer for now (SmartScreen warning on first start)
  desktop-win:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          ptsl-proto: ${{ secrets.PTSL_PROTO_B64 }}
      - name: Set version from tag
        working-directory: packages/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build
        working-directory: packages/desktop
        run: pnpm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-win
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 1

  # Resolve plugin: signed + notarized .pkg
  resolve-mac:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Set version from tag
        working-directory: packages/plugin-resolve
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Import signing certificate
        env:
          MAC_CERTS_P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw=$(openssl rand -hex 16)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$MAC_CERTS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certs.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" > /dev/null
          # Word splitting is intended: one argument per existing keychain
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
      - name: Build, sign and notarize
        working-directory: packages/plugin-resolve
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          pnpm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: resolve-mac
          path: packages/plugin-resolve/release/*.pkg
          if-no-files-found: error
          retention-days: 1

  # Resolve plugin for Windows: unsigned NSIS installer for now
  resolve-win:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Set version from tag
        working-directory: packages/plugin-resolve
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build installer
        working-directory: packages/plugin-resolve
        run: pnpm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: resolve-win
          path: packages/plugin-resolve/release/*.exe
          if-no-files-found: error
          retention-days: 1

  # Premiere plugin: .ccx (a zip of dist/), no signing for distribution outside the Marketplace
  premiere:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        working-directory: packages/plugin-premiere
        run: pnpm run build
      - name: Set version from tag
        working-directory: packages/plugin-premiere
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build .ccx
        working-directory: packages/plugin-premiere
        run: pnpm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: premiere-ccx
          path: packages/plugin-premiere/release/*.ccx
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [merge, desktop-mac, desktop-win, resolve-mac, resolve-win, premiere]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/desktop
          pattern: desktop-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/desktop
          pattern: resolve-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/desktop
          pattern: premiere-*
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # GitHub renames assets whose name starts with a dot, so .env.example ships as env.example
        run: |
          cp deploy/.env.example "$RUNNER_TEMP/env.example"
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" deploy/compose.yml "$RUNNER_TEMP/env.example" "$RUNNER_TEMP"/desktop/* \
            --title "$TAG" --generate-notes --verify-tag "${prerelease[@]}"

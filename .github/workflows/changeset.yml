name: Changeset

# Every pull request that changes a package needs a changeset, so each release has its notes and
# What's New has something to show. Changes without anything to tell users (refactors, CI,
# dependency bumps) get an empty one: pnpm changeset add --empty
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: changeset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      # changeset status compares against the base branch, so it needs the history
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check for a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! pnpm changeset status --since="origin/$BASE_REF"; then
            echo "::error::This pull request changes packages but has no changeset. Run 'pnpm changeset' (or 'pnpm changeset add --empty' if there is nothing to tell users) and commit the file."
            exit 1
          fi
